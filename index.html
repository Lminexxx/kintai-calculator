<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤怠計算ツール</title>
<style>
:root {
  --bg-color: #fcf6f5;
  --card-bg: #ffffff;
  --text-main: #5a4b4c;
  --text-sub: #8c7b7c;
  --primary: #eaa0a2;
  --primary-hover: #d88e90;
  --accent: #64c5b1;
  --accent-hover: #52b39f;
  --danger: #f08a8b;
  --danger-hover: #dd7576;
  --border-color: #f0e6e6;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg-color);
  margin: 0;
  padding: 16px;
  color: var(--text-main);
}

.card {
  background: var(--card-bg);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 4px 15px rgba(218, 180, 182, 0.15);
  border: 1px solid var(--border-color);
}

h2 {
  margin: 0 0 16px;
  font-size: 17px;
  color: var(--text-main);
  border-bottom: 2px dashed var(--primary);
  padding-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.row {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
}

.col {
  flex: 1;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--text-sub);
}

input {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border-color);
  border-radius: 10px;
  font-size: 15px;
  box-sizing: border-box;
  color: var(--text-main);
  background: #faf6f6;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}

input:focus {
  border-color: var(--primary);
  background: #fff;
}

button {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: bold;
  margin-top: 6px;
  cursor: pointer;
  box-shadow: 0 3px 8px rgba(234, 160, 162, 0.4);
  transition: background 0.2s, transform 0.1s;
}

button:active {
  transform: scale(0.98);
}

button:hover {
  background: var(--primary-hover);
}

.btn-dl {
  background: var(--accent);
  box-shadow: 0 3px 8px rgba(100, 197, 177, 0.4);
  margin-top: 12px;
}

.btn-dl:hover {
  background: var(--accent-hover);
}

.btn-danger {
  background: transparent;
  color: var(--danger);
  border: 1.5px solid var(--danger);
  box-shadow: none;
  margin-top: 8px;
}

.btn-danger:hover {
  background: #fdf0f0;
}

.btn-del-sm {
  background: #fde8e8;
  color: var(--danger);
  border: none;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.2s;
}

.btn-del-sm:hover {
  background: #f8d0d0;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 13px;
}

th, td {
  border-bottom: 1px solid var(--border-color);
  padding: 10px 4px;
  text-align: center;
  vertical-align: middle;
}

th {
  background: #fcf4f4;
  color: var(--text-sub);
  font-weight: 600;
  border-radius: 6px;
}

.result-box {
  background: #f3fbf9;
  border: 1px solid #d2f0ea;
  border-radius: 10px;
  padding: 12px;
  margin-top: 8px;
  font-size: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: #2e7d6e;
}

.result-box strong {
  color: #1b5e50;
  font-size: 16px;
}
</style>
</head>
<body>

<div class="card">
  <h2>勤怠入力</h2>
  <div class="row">
    <div class="col"><label>日付</label><input type="date" id="date"></div>
  </div>
  <div class="row">
    <div class="col"><label>出勤時刻</label><input type="time" id="start"></div>
    <div class="col"><label>退勤時刻</label><input type="time" id="end"></div>
  </div>
  <button onclick="addLog()">計算・記録する</button>
</div>

<div class="card">
  <h2>勤怠履歴</h2>
  <div id="latestResult" class="result-box" style="display:none;"></div>
  <table>
    <thead>
      <tr>
        <th>日付</th>
        <th>出勤(15分切上)</th>
        <th>退勤</th>
        <th>休憩</th>
        <th>実労働時間</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="logTable"></tbody>
  </table>
  <button class="btn-dl" onclick="downloadCSV()">CSV保存（スプレッドシート用）</button>
  <button class="btn-danger" onclick="clearAllLogs()">履歴をすべて消去</button>
</div>

<script>
document.getElementById('date').valueAsDate = new Date();
let logs = JSON.parse(localStorage.getItem('kintai_logs') || '[]');
render();

function addLog() {
  const d = document.getElementById('date').value;
  const s = document.getElementById('start').value;
  const e = document.getElementById('end').value;
  if (!d || !s || !e) { 
    alert('日付・出勤・退勤をすべて入力してください'); 
    return; 
  }
  
  const [sH, sM] = s.split(':').map(Number);
  let roundedM = Math.ceil(sM / 15) * 15;
  let roundedH = sH;
  if (roundedM === 60) { 
    roundedM = 0; 
    roundedH = (roundedH + 1) % 24; 
  }
  const roundedStart = `${String(roundedH).padStart(2, '0')}:${String(roundedM).padStart(2, '0')}`;

  const startMin = roundedH * 60 + roundedM;
  const [eH, eM] = e.split(':').map(Number);
  const endMin = eH * 60 + eM;
  
  let grossMin = endMin - startMin;
  if (grossMin < 0) grossMin += 24 * 60;

  let breakMin = 0;
  if (grossMin > 8 * 60) breakMin = 60;
  else if (grossMin > 6 * 60) breakMin = 45;

  const workMin = grossMin - breakMin;
  const wH = Math.floor(workMin / 60);
  const wM = workMin % 60;
  const workText = `${wH}時間${wM}分`;

  const item = { 
    date: d, 
    start: s, 
    roundedStart: roundedStart, 
    end: e, 
    breakMin: breakMin, 
    workText: workText 
  };

  logs.unshift(item);
  localStorage.setItem('kintai_logs', JSON.stringify(logs));
  render();
}

function deleteLog(index) {
  if (confirm('この記録を削除しますか？')) {
    logs.splice(index, 1);
    localStorage.setItem('kintai_logs', JSON.stringify(logs));
    render();
  }
}

function clearAllLogs() {
  if (logs.length === 0) {
    alert('削除するデータがありません');
    return;
  }
  if (confirm('すべての勤怠履歴を削除してもよろしいですか？')) {
    logs = [];
    localStorage.removeItem('kintai_logs');
    render();
  }
}

function render() {
  const tbody = document.getElementById('logTable');
  const resBox = document.getElementById('latestResult');
  tbody.innerHTML = '';
  
  logs.forEach((l, index) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(l.date.slice(5))}</td>
      <td>${escapeHtml(l.roundedStart)}</td>
      <td>${escapeHtml(l.end)}</td>
      <td>${escapeHtml(String(l.breakMin))}分</td>
      <td><strong>${escapeHtml(l.workText)}</strong></td>
      <td><button class="btn-del-sm" onclick="deleteLog(${index})">削除</button></td>
    `;
    tbody.appendChild(tr);
  });

  if (logs.length > 0) {
    const r = logs[0];
    resBox.style.display = 'flex';
    resBox.innerHTML = `
      <div>最新記録: <strong>${escapeHtml(r.workText)}</strong> （出勤:${escapeHtml(r.roundedStart)} / 休憩:${escapeHtml(String(r.breakMin))}分）</div>
      <button class="btn-del-sm" onclick="deleteLog(0)">削除</button>
    `;
  } else {
    resBox.style.display = 'none';
  }
}

function downloadCSV() {
  if (logs.length === 0) { 
    alert('データがありません'); 
    return; 
  }
  let csv = "日付,打刻出勤,15分切上出勤,退勤,休憩(分),実労働時間\n";
  logs.forEach(l => { 
    csv += `${l.date},${l.start},${l.roundedStart},${l.end},${l.breakMin},${l.workText}\n`; 
  });
  const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '勤怠記録.csv';
  a.click();
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
</script>
</body>
</html>
